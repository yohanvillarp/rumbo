version: 2
updates:
  # Maintain Gradle dependencies and Version Catalog in gradle/libs.versions.toml
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "build(deps)"
    groups:
      androidx-and-compose:
        patterns:
          - "androidx.*"
          - "com.google.android.material:*"
      kotlin-and-tooling:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.android.*"
          - "gradle"
      hilt-and-di:
        patterns:
          - "com.google.dagger*"
      testing:
        patterns:
          - "junit*"
          - "org.junit*"
          - "androidx.test*"
          - "com.google.truth*"
          - "app.cash.turbine*"
      coroutines:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
    ignore:
      # Block library versions that require compileSdk 37+ until the project officially migrates
      - dependency-name: "androidx.hilt:hilt-navigation-compose"
        versions: [">= 1.3.0"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2025.0.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.16.0"]
      # Block major bumps on compiler and tooling to maintain Kotlin/KSP parity
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.devtools.ksp*"
        update-types: ["version-update:semver-major"]

  # Maintain GitHub Actions workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
